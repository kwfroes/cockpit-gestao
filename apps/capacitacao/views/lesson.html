<div class="animate-fade-in w-full max-w-2xl mx-auto flex flex-col min-h-[85vh]">
    
    <!-- Header da Lição -->
    <div class="flex items-center gap-4 mb-6">
        <button id="btn-fechar-licao" class="text-slate-400 hover:text-red-500 transition-colors p-2" title="Sair da lição">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <!-- Barra de Progresso -->
        <div class="flex-1 h-4 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden shadow-inner">
            <div id="lesson-progress-bar" class="h-full bg-emerald-500 w-0 transition-all duration-500 rounded-full"></div>
        </div>
    </div>

    <!-- Dica Dinâmica do Mascote -->
    <div id="mascote-container" class="flex items-center gap-4 mb-6 bg-blue-50 dark:bg-blue-900/20 p-4 rounded-xl border border-blue-100 dark:border-blue-800/50 shadow-sm transition-all">
        <img id="mascote-img" src="../../assets/img/capacitacao/srcockpit/sr_cockpit_tablet.png" alt="Sr. Cockpit Analisando" class="w-16 h-16 drop-shadow-md object-contain">
        <div class="text-sm text-blue-800 dark:text-blue-300 font-medium leading-relaxed">
            <strong class="uppercase text-[10px] tracking-widest block mb-1">Sr. Cockpit diz:</strong> 
            <span id="mascote-fala">Leia atentamente as orientações antes de avançar.</span>
        </div>
    </div>

    <!-- Conteúdo Central -->
    <div class="flex-1 flex flex-col justify-center" id="lesson-content">
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2" id="lesson-module-title">Módulo</h2>
        <h3 class="text-2xl font-bold text-slate-800 dark:text-white mb-6" id="lesson-title">Carregando conteúdo...</h3>
        
        <div id="lesson-body" class="text-slate-700 dark:text-slate-300 text-base md:text-lg mb-8 leading-relaxed space-y-4">
            <p class="text-center animate-pulse">Consultando a base de conhecimento...</p>
        </div>

        <div id="lesson-options" class="space-y-3 hidden">
            <!-- Alternativas serão injetadas aqui -->
        </div>
    </div>

    <!-- Rodapé de Ação / Feedback -->
    <div class="mt-8 border-t border-slate-200 dark:border-slate-700 pt-6 flex flex-col sm:flex-row justify-between items-center gap-4 min-h-[80px]">
        <div id="feedback-area" class="flex-1 font-bold text-sm md:text-base hidden flex-col justify-center w-full sm:w-auto p-4 rounded-xl">
            <div class="flex items-center gap-2 mb-1" id="feedback-title"></div>
            <p id="feedback-desc" class="text-xs md:text-sm font-medium opacity-90"></p>
        </div>
        
        <button id="btn-acao-licao" disabled class="w-full sm:w-auto px-8 py-3.5 bg-slate-300 dark:bg-slate-700 text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider rounded-xl shadow-md transition-all">
            Aguarde
        </button>
    </div>
</div>
