<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitação - Cockpit Gestão</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class", theme: { extend: { colors: { slate: { 850: "#1e293b" } }, fontFamily: { sans: ["Inter", "sans-serif"] } } } };
    </script>
    <script>
      (function () {
        const isAuthenticated = sessionStorage.getItem("cockpit_auth_token") === "valid";
        if (!isAuthenticated) window.top.location.href = "../../index.html";
        var savedTheme = localStorage.getItem("cockpit_theme");
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (savedTheme === "dark" || (!savedTheme && systemDark)) document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
    <style>html.dark body { background-color: #0f172a; color: #f3f4f6; } .animate-fade-in { animation: fadeIn 0.4s ease-out; } @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }</style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen pb-20">
    
    <header class="bg-white dark:bg-slate-900 border-b dark:border-slate-800 p-4 sticky top-0 z-40 shadow-sm">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3" onclick="document.querySelector('#btn-voltar-admin')?.click() || window.location.reload()" style="cursor:pointer">
                <div class="p-2 bg-purple-600 rounded-lg text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold dark:text-white leading-none">Academia CGCF</h1>
                    <p class="text-[10px] text-gray-600 dark:text-gray-400 uppercase font-bold tracking-wider mt-1">Trilhas de Qualificação</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-4 flex-wrap justify-end" id="header-stats-container">
                <div class="flex items-center gap-2 bg-amber-50 dark:bg-amber-900/20 px-3 py-1.5 rounded-full border border-amber-200 dark:border-amber-800">
                    <span class="text-amber-500 font-bold text-sm">🔥 <span id="streak-days">0</span></span>
                </div>
                <div class="flex items-center gap-2 bg-blue-50 dark:bg-blue-900/20 px-3 py-1.5 rounded-full border border-blue-200 dark:border-blue-800">
                    <span class="text-blue-600 dark:text-blue-400 font-bold text-sm">⚡ <span id="xp-total">0</span> XP</span>
                </div>
                <div class="flex items-center gap-2 bg-emerald-50 dark:bg-emerald-900/20 px-3 py-1.5 rounded-full border border-emerald-200 dark:border-emerald-800" title="Sequência de acertos">
                    <span class="text-emerald-600 dark:text-emerald-400 font-bold text-sm">🎯 <span id="seq-acertos">0</span></span>
                </div>
                <!-- Admin button injetado aqui -->
            </div>
        </div>
    </header>

    <main id="router-view" class="max-w-4xl mx-auto p-6">
        <p class="text-center text-slate-500 mt-10 animate-pulse">Carregando plataforma...</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/auth.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
