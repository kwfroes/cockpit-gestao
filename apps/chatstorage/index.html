<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cockpit Drive & Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.2/dist/docx-preview.min.js"></script>
  <link rel="stylesheet" href="style.css">

  <!-- Configuração do Tailwind EXATAMENTE como no apps/matrix -->
  <script>
    window.tailwind = {
      config: {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              slate: { 850: "#1e293b" },
            },
          },
        },
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Aplicação imediata do tema Cockpit ao carregar -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem("cockpit_theme") || "light";
      if (savedTheme === "dark") {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-300 overflow-x-hidden">
  
  <!-- Header / Topbar -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-30 shadow-sm shrink-0">
    <div class="flex items-center gap-4">
      <a href="../../index.html" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 hover:text-slate-800 dark:hover:text-white transition" title="Voltar ao Cockpit">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      </a>
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          <span>📁</span> Cockpit Drive
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">Armazenamento em nuvem, pastas e mensagens</p>
      </div>
    </div>

    <!-- Indicador de Cota -->
    <div class="flex items-center gap-4 sm:gap-6">
      <div class="hidden sm:flex flex-col items-end">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-xs font-medium text-slate-600 dark:text-slate-300" id="quota-text">Calculando...</span>
          <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300" id="quota-pct">0%</span>
        </div>
        <div class="w-48 bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
          <div id="quota-bar" class="bg-blue-600 h-full w-0 transition-all duration-500"></div>
        </div>
      </div>

      <button id="btn-toggle-chat" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-200 transition" title="Abrir/Fechar Chat">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
      </button>
    </div>
  </header>

<!-- Conteúdo Principal Dividido -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- Container Relativo da Área do Drive -->
    <div class="flex-1 relative flex flex-col overflow-hidden">
      
      <!-- Painel de Arquivos com Scroll -->
      <main class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-6">
        
        <!-- Fila de Uploads Ativos -->
        <section id="upload-queue" class="hidden flex flex-col gap-2 bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Envios em curso</h3>
          <div id="queue-items" class="flex flex-col gap-2"></div>
        </section>

        <!-- Barra de Controle: Pastas, Breadcrumbs e Filtros -->
        <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
          <div class="flex items-center gap-3 flex-wrap">
            <button id="btn-nova-pasta" class="flex items-center gap-2 px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold shadow-sm transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
              <span>Nova Pasta</span>
            </button>
            <button id="btn-esvaziar-lixeira" class="hidden items-center gap-2 px-3.5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-semibold shadow-sm transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              <span>Esvaziar Lixeira</span>
            </button>
            <nav id="breadcrumbs" class="flex items-center gap-1.5 text-xs text-slate-500 dark:text-slate-400 bg-slate-200/60 dark:bg-slate-800 px-3 py-2 rounded-xl"></nav>
          </div>

          <div class="flex flex-col sm:flex-row items-center gap-3">
            <div class="flex items-center gap-1 bg-slate-200/60 dark:bg-slate-800 p-1 rounded-xl text-xs w-full sm:w-auto">
              <button class="filter-tab px-3 py-1.5 rounded-lg font-medium transition bg-white dark:bg-slate-700 shadow-sm text-slate-900 dark:text-white" data-tab="all">Todos</button>
              <button class="filter-tab px-3 py-1.5 rounded-lg font-medium transition text-slate-600 dark:text-slate-400 hover:text-slate-900" data-tab="mine">Meus</button>
              <button class="filter-tab px-3 py-1.5 rounded-lg font-medium transition text-slate-600 dark:text-slate-400 hover:text-slate-900" data-tab="shared">Partilhados</button>
              <button class="filter-tab px-3 py-1.5 rounded-lg font-medium transition text-slate-600 dark:text-slate-400 hover:text-slate-900" data-tab="lixeira">🗑️ Lixeira</button>
            </div>

            <div class="relative w-full sm:w-60">
              <input type="text" id="search-input" placeholder="Buscar arquivo..." class="w-full pl-8 pr-3 py-1.5 rounded-xl text-xs border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-200">
              <svg class="w-3.5 h-3.5 absolute left-2.5 top-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
          </div>
        </div>

        <!-- Tabela de Arquivos e Pastas -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden shadow-sm flex-1 flex flex-col">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-50 dark:bg-slate-700/50 text-slate-500 border-b border-slate-200 dark:border-slate-700 text-xs font-semibold">
                <tr>
                  <th class="py-3 px-4">Nome</th>
                  <th class="py-3 px-4">Tamanho</th>
                  <th class="py-3 px-4">Autor</th>
                  <th class="py-3 px-4">Data</th>
                  <th class="py-3 px-4 text-right">Ações</th>
                </tr>
              </thead>
              <tbody id="files-tbody" class="divide-y divide-slate-100 dark:divide-slate-700/50">
                <tr>
                  <td colspan="5" class="py-12 text-center text-slate-400">Carregando conteúdo...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>

      <!-- Input de Arquivos (Invisível) e Overlay de Drag & Drop -->
      <input type="file" id="file-input" multiple class="hidden">

      <div id="drag-overlay" class="hidden absolute inset-0 z-30 bg-blue-600/10 dark:bg-blue-500/10 backdrop-blur-[2px] border-4 border-dashed border-blue-500 rounded-2xl m-3 flex items-center justify-center pointer-events-none transition-all">
        <div class="bg-white dark:bg-slate-800 px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 border border-slate-200 dark:border-slate-700">
          <span class="text-2xl">📥</span>
          <p class="text-sm font-bold text-slate-800 dark:text-slate-100">Solte os arquivos aqui para enviar</p>
        </div>
      </div>

      <!-- Botão Flutuante (+) Restrito EXCLUSIVAMENTE ao Drive -->
      <button id="fab-upload" class="absolute bottom-6 right-6 z-20 w-14 h-14 rounded-full bg-blue-600 hover:bg-blue-700 text-white shadow-xl hover:shadow-2xl flex items-center justify-center transition-all transform hover:scale-105 active:scale-95 group focus:outline-none" title="Enviar novo arquivo">
        <svg class="w-6 h-6 transition-transform group-hover:rotate-90 duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
        </svg>
      </button>

    </div>

    <!-- Painel Lateral de Chat -->
    <aside id="chat-panel" class="w-80 md:w-96 border-l border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800 flex flex-col transition-all duration-300">
      
      <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <h2 class="font-bold text-sm flex items-center gap-2">💬 Mensagens</h2>
          <button id="btn-close-chat" class="p-1 rounded-md text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <!-- Abas do Chat: Mural vs Privado -->
        <div class="grid grid-cols-2 p-1 bg-slate-100 dark:bg-slate-900 rounded-xl text-xs font-medium">
          <button id="tab-chat-general" class="py-1.5 rounded-lg bg-white dark:bg-slate-800 shadow-sm text-blue-600 dark:text-blue-400 font-bold transition">
            📢 Mural Geral
          </button>
          <button id="tab-chat-direct" class="py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
            🔒 Privado (DM)
          </button>
        </div>

        <!-- Seletor de escopo do Mural -->
        <div id="mural-scope-container">
          <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Visível para:</label>
          <select id="mural-scope" class="w-full text-xs px-2.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-200"></select>
        </div>

        <!-- Seletor do Colega -->
        <div id="dm-select-container" class="hidden">
          <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Conversar com:</label>
          <select id="chat-target-user" class="w-full text-xs px-2.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-200">
            <option value="">Selecione um colega...</option>
          </select>
        </div>
      </div>

      <!-- Feed de Mensagens -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3">
        <!-- Render dinâmico -->
      </div>

      <!-- Painel de seleção de anexo (some quando fechado) -->
      <div id="anexo-picker" class="hidden border-t border-slate-200 dark:border-slate-800 max-h-48 overflow-y-auto p-2 bg-slate-50 dark:bg-slate-900/60">
        <button type="button" id="btn-anexo-upload-novo" class="w-full flex items-center gap-2 px-2.5 py-2 rounded-lg text-left bg-white dark:bg-slate-800 border border-dashed border-blue-300 dark:border-blue-700 text-blue-600 dark:text-blue-400 mb-1.5">
          <span class="text-base shrink-0">📤</span>
          <span class="text-xs font-bold">Enviar arquivo novo (até 10MB)</span>
        </button>
        <input type="file" id="anexo-upload-input" class="hidden">
        <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-2 pt-1 pb-1">Ou escolha um arquivo seu já salvo</p>
        <div id="anexo-picker-lista" class="flex flex-col gap-1"></div>
      </div>

      <!-- Chip do arquivo selecionado pra envio -->
      <div id="anexo-chip" class="hidden px-3 pt-2 flex items-center gap-2 text-xs">
        <span class="px-2.5 py-1 rounded-lg bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 flex items-center gap-1.5">
          📎 <span id="anexo-chip-nome" class="font-medium truncate max-w-[160px]"></span>
          <button type="button" id="btn-remover-anexo" class="text-blue-400 hover:text-blue-700 dark:hover:text-blue-100">✕</button>
        </span>
      </div>

      <!-- Formulário de Envio -->
      <form id="chat-form" class="p-3 border-t border-slate-200 dark:border-slate-800 flex gap-2">
        <button type="button" id="btn-abrir-anexo" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-300 transition shrink-0" title="Anexar arquivo do Drive">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
        </button>
        <input type="text" id="chat-input" placeholder="Escreva sua mensagem..." class="flex-1 px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-200">
        <button type="submit" class="p-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white transition flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </form>
    </aside>

  </div>

  <!-- Modal Nova Pasta -->
  <div id="folder-modal" class="modal">
    <div class="modal-content !max-w-sm">
      <div class="flex items-center justify-between border-b pb-3 mb-4 border-slate-200 dark:border-slate-700">
        <h3 class="font-bold text-base">Nova Pasta</h3>
        <button onclick="closeFolderModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>
      <form id="folder-form" class="flex flex-col gap-4">
        <div>
          <label class="block text-xs font-semibold mb-1">Nome da Pasta</label>
          <input type="text" id="folder-name-input" required placeholder="Ex: Material do Curso" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-200">
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeFolderModal()" class="px-4 py-2 text-xs rounded-xl bg-slate-200 dark:bg-slate-700">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-xs rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium">Criar Pasta</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de Partilha -->
  <div id="share-modal" class="modal">
    <div class="modal-content !max-w-md">
      <div class="flex items-center justify-between border-b pb-3 mb-4 border-slate-200 dark:border-slate-700">
        <h3 class="font-bold text-base">Partilhar Documento</h3>
        <button onclick="closeShareModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>
      <p class="text-xs text-slate-500 mb-4" id="share-file-name"></p>
      <div class="flex flex-col gap-2 max-h-60 overflow-y-auto" id="users-share-list"></div>
      <div class="mt-4 pt-3 border-t border-slate-200 dark:border-slate-700 flex justify-end">
        <button onclick="closeShareModal()" class="px-4 py-2 text-xs rounded-xl bg-slate-200 dark:bg-slate-700">Concluir</button>
      </div>
    </div>
  </div>

  <!-- Modal de Pré-visualização Integrada -->
  <div id="preview-modal" class="modal">
    <div class="modal-content !max-w-5xl h-[88vh] flex flex-col p-4 md:p-6">
      
      <!-- Cabeçalho do Modal -->
      <div class="flex items-center justify-between border-b pb-3 mb-4 border-slate-200 dark:border-slate-700 shrink-0">
        <div class="flex items-center gap-2 truncate pr-4">
          <span id="preview-icon" class="text-xl">📄</span>
          <h3 id="preview-title" class="font-bold text-sm md:text-base truncate">Visualizar Arquivo</h3>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="preview-btn-download" class="p-2 rounded-lg bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-blue-900/50 text-xs font-semibold flex items-center gap-1.5 transition" title="Baixar original">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            <span class="hidden sm:inline">Baixar</span>
          </button>
          <button onclick="closePreviewModal()" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg leading-none">✕</button>
        </div>
      </div>

      <!-- Área de Exibição do Conteúdo -->
      <div id="preview-body" class="flex-1 overflow-auto rounded-xl bg-slate-100 dark:bg-slate-950 flex items-center justify-center p-2 relative">
        <!-- Render dinâmico de vídeo, pdf, docx, imagem ou texto -->
      </div>
    </div>
    </div>

  <div id="toast"></div>

  <script src="../../assets/auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
